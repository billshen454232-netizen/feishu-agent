<!DOCTYPE html>
<!--
  飞书机器人 · 项目计划看板
  【完整维护指南】.claude/skills/plan-board/SKILL.md
  【日常只改两个数据对象，不动 <style> 和渲染函数】
    PLAN_DATA.steps  = 计划卡片   { id:"22", status:"todo|active|todo", title, desc,
                                   done:[], current:[], remaining:[] }
    FLOWS[stepId]    = 该步骤的时序图  { title, actors:[{id,name,sub}],
                                   msgs:[{from,to,s:"done|active|todo",t,d}] }
  【三条硬规则】
    1. status / msg.s 都只有三态：done / active / todo，禁止第四态。
    2. done 只写有本地或环境证据支持的事项；不把候选物、计划或推断标为已完成。
    3. 批注与疑问只存浏览器 localStorage，不写入 Git。
  【已知待办默认上板，不反问】计划即备忘，上下文有限，不写进来就是用户忘、AI 也忘。
-->
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞书机器人 · 项目计划</title>
  <style>
    /* ==================== 主题变量 ==================== */
    :root[data-theme="dark"] {
      --bg-canvas: #090a0f;
      --bg-dot: rgba(255, 255, 255, 0.06);
      --bg-shell: #11131a;
      --bg-surface: #171a24;
      --bg-surface-hover: #1c202c;

      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-default: rgba(255, 255, 255, 0.11);
      --border-active: #3b82f6;

      --text-main: #f4f6fb;
      --text-sub: #9ba3b8;
      --text-muted: #5e667a;

      --emerald: #10b981;
      --emerald-soft: rgba(16, 185, 129, 0.14);
      --blue: #3b82f6;
      --blue-bright: #60a5fa;
      --blue-soft: rgba(59, 130, 246, 0.16);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.12);

      --shadow-shell: 0 32px 64px -16px rgba(0, 0, 0, 0.75);
      --shadow-card: 0 8px 24px -12px rgba(0, 0, 0, 0.5);
    }

    :root[data-theme="light"] {
      --bg-canvas: #f1f5f9;
      --bg-dot: rgba(15, 23, 42, 0.07);
      --bg-shell: #ffffff;
      --bg-surface: #f8fafc;
      --bg-surface-hover: #f1f5f9;

      --border-subtle: #e2e8f0;
      --border-default: #cbd5e1;
      --border-active: #2563eb;

      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;

      --emerald: #059669;
      --emerald-soft: rgba(5, 150, 105, 0.12);
      --blue: #2563eb;
      --blue-bright: #1d4ed8;
      --blue-soft: rgba(37, 99, 235, 0.1);
      --amber: #d97706;
      --amber-soft: rgba(217, 119, 6, 0.12);

      --shadow-shell: 0 20px 45px -15px rgba(15, 23, 42, 0.1);
      --shadow-card: 0 4px 16px -8px rgba(15, 23, 42, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background-color: var(--bg-canvas);
      background-image: radial-gradient(var(--bg-dot) 1px, transparent 1px);
      background-size: 20px 20px;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 28px 20px 60px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .wrap { width: 100%; max-width: 1460px; margin: 0 auto; }

    /* ==================== 内容列 ==================== */
    .main-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
      align-items: start;
    }
    .content-col { min-width: 0; }

    /* ==================== 顶栏 ==================== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 5px 11px;
      border-radius: 6px;
      background: var(--blue-soft);
      color: var(--blue-bright);
      white-space: nowrap;
    }
    h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

    .progress-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg-shell);
      border: 1px solid var(--border-subtle);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 13px;
    }
    .progress-pill-label { color: var(--text-sub); }
    .progress-pill-value { font-weight: 700; font-variant-numeric: tabular-nums; }
    .mini-bar { width: 72px; height: 6px; background: var(--border-subtle); border-radius: 999px; overflow: hidden; }
    .mini-bar-fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--blue)); border-radius: 999px; }

    .btn {
      cursor: pointer;
      background: var(--bg-shell);
      border: 1px solid var(--border-default);
      color: var(--text-sub);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover { color: var(--text-main); border-color: var(--blue); }
    .btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
    .btn-primary:hover { filter: brightness(1.08); color: #fff; }

    /* ==================== 原则条 ==================== */
    .principle {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      background: var(--amber-soft);
      border: 1px solid rgba(245, 158, 11, 0.28);
      border-radius: 12px;
      padding: 13px 16px;
      margin-bottom: 22px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-main);
    }
    .principle-icon { color: var(--amber); font-size: 15px; line-height: 1.5; }
    .principle-label { color: var(--amber); font-weight: 700; }

    /* ==================== 筛选 ==================== */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .filter-btn {
      cursor: pointer;
      padding: 7px 15px;
      border-radius: 999px;
      border: 1px solid var(--border-default);
      background: var(--bg-shell);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .filter-btn:hover { color: var(--text-main); }
    .filter-btn.active { background: var(--blue); border-color: var(--blue); color: #fff; }
    .filter-btn .cnt {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.14);
    }
    .filter-btn.active .cnt { background: rgba(255, 255, 255, 0.22); }

    /* ==================== 卡片网格 ==================== */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(272px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 14px;
      padding: 18px 18px 16px;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 11px;
      min-height: 172px;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-active);
      box-shadow: var(--shadow-card);
    }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .step-num {
      width: 32px; height: 32px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800;
      background: var(--bg-shell);
      border: 1px solid var(--border-default);
      color: var(--text-sub);
      flex-shrink: 0;
    }
    .status-tag {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .status-done .status-tag { background: var(--emerald-soft); color: var(--emerald); }
    .status-active .status-tag { background: var(--blue-soft); color: var(--blue-bright); }
    .status-todo .status-tag { background: rgba(148, 163, 184, 0.16); color: var(--text-sub); }

    /* 状态标签可点击，弹出切换菜单 */
    .status-tag[data-editable] {
      cursor: pointer;
      position: relative;
      user-select: none;
    }
    .status-tag[data-editable]:hover { filter: brightness(1.15); }
    .status-menu {
      position: absolute;
      z-index: 50;
      min-width: 128px;
      background: var(--bg-shell);
      border: 1px solid var(--border-default);
      border-radius: 10px;
      padding: 5px;
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.45);
    }
    .status-menu button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--text-main);
      padding: 8px 11px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .status-menu button:hover { background: var(--bg-surface-hover); }
    .status-menu button.current { color: var(--blue-bright); }
    .status-menu .hint {
      padding: 6px 11px 3px;
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .card-title { font-size: 15.5px; font-weight: 700; line-height: 1.35; color: var(--text-main); }
    .card-desc { font-size: 12.5px; line-height: 1.5; color: var(--text-sub); flex: 1; }

    .card-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding-top: 11px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11.5px;
      color: var(--text-muted);
    }
    .card-foot .open { color: var(--blue-bright); font-weight: 700; }

    .note-flag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      background: var(--amber-soft);
      color: var(--amber);
    }

    /* 状态色条 */
    .card::before {
      content: "";
      position: absolute;
      left: 0; top: 16px; bottom: 16px;
      width: 3px;
      border-radius: 3px;
    }
    .status-done .card-foot, .status-done .step-num { }
    .status-done::before { background: var(--emerald); }
    .status-active::before { background: var(--blue); }
    .status-todo::before { background: var(--border-default); }
    .status-active .step-num { background: var(--blue); color: #fff; border-color: var(--blue); }

    /* ==================== 详情视图 ==================== */
    .detail {
      display: none;
      background: var(--bg-shell);
      border: 1px solid var(--border-default);
      border-radius: 16px;
      overflow: hidden;
    }
    .detail.show { display: block; }
    .grid.hide { display: none; }

    .detail-head {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
      background: var(--bg-surface);
    }
    .detail-topline {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap; margin-bottom: 10px;
    }
    .detail-title { font-size: 21px; font-weight: 800; line-height: 1.3; }
    .detail-desc { font-size: 13.5px; color: var(--text-sub); line-height: 1.55; margin-top: 7px; }

    .detail-body { padding: 22px 24px; display: flex; flex-direction: column; gap: 18px; }

    .block {
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
    }
    .block-head {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-subtle);
    }
    .block-head .ico {
      width: 22px; height: 22px; border-radius: 6px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    .block-head .n { margin-left: auto; color: var(--text-muted); font-size: 11.5px; font-weight: 600; }
    .block-done .block-head { background: var(--emerald-soft); color: var(--emerald); }
    .block-done .block-head .ico { background: var(--emerald); color: #fff; }
    .block-cur .block-head { background: var(--blue-soft); color: var(--blue-bright); }
    .block-cur .block-head .ico { background: var(--blue); color: #fff; }
    .block-todo .block-head { background: rgba(148, 163, 184, 0.12); color: var(--text-sub); }
    .block-todo .block-head .ico { background: var(--text-sub); color: var(--bg-shell); }

    .block-body { padding: 13px 16px; }
    .block-body ul { list-style: none; display: flex; flex-direction: column; gap: 9px; }
    .block-body li {
      display: flex; gap: 9px; align-items: flex-start;
      font-size: 13px; line-height: 1.55; color: var(--text-main);
    }
    .block-body li .mk { flex-shrink: 0; margin-top: 1px; }
    .block-done .mk { color: var(--emerald); }
    .block-cur .mk { color: var(--blue); }
    .block-todo .mk { color: var(--text-muted); }
    .block-empty {
      padding: 13px 16px;
      font-size: 12.5px;
      color: var(--text-muted);
      font-style: italic;
    }

    /* ==================== 批注 / 疑问 ==================== */
    .notes-block {
      border: 1px solid var(--border-default);
      border-radius: 12px;
      overflow: hidden;
      margin-top: 4px;
    }
    .notes-head {
      display: flex; align-items: center; gap: 9px;
      padding: 11px 16px;
      background: var(--amber-soft);
      color: var(--amber);
      font-size: 13px; font-weight: 700;
      border-bottom: 1px solid var(--border-subtle);
    }
    .notes-head .hint { margin-left: auto; font-size: 11px; font-weight: 500; color: var(--text-muted); }
    .note-field { padding: 13px 16px; border-bottom: 1px solid var(--border-subtle); }
    .note-field:last-child { border-bottom: none; }
    .note-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 12.5px; font-weight: 700;
      color: var(--text-sub); margin-bottom: 7px;
    }
    textarea {
      width: 100%;
      min-height: 74px;
      resize: vertical;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-main);
      font-size: 13px;
      line-height: 1.55;
      font-family: inherit;
      transition: border-color 0.15s ease;
    }
    textarea:focus { outline: none; border-color: var(--blue); }
    textarea::placeholder { color: var(--text-muted); }

    .save-status {
      font-size: 11px; color: var(--text-muted);
      display: inline-flex; align-items: center; gap: 5px;
    }
    .save-status.saved { color: var(--emerald); }

    /* ==================== 响应式 ==================== */
    @media (max-width: 620px) {
      h1 { font-size: 18px; }
      .grid { grid-template-columns: 1fr; }
      .detail-body, .detail-head { padding-left: 16px; padding-right: 16px; }
    }

    /* ==================== 步骤时序图 ==================== */
    .flow-block{border:1px solid var(--border-default);border-radius:12px;background:var(--bg-surface);overflow:hidden}
    .flow-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border-subtle);font-weight:700;font-size:14px;color:var(--text-main)}
    .flow-legend{margin-left:auto;display:flex;gap:12px;font-size:12px;font-weight:500;color:var(--text-sub)}
    .flow-legend i{display:inline-block;width:18px;height:0;border-top:2px solid;vertical-align:middle;margin-right:5px}
    .flow-scroll{overflow-x:auto;padding:8px 8px 0}
    svg.seq{display:block;width:100%;height:auto}
    svg.seq text{font-family:inherit;fill:var(--text-sub);font-size:12px}
    svg.seq .a-box{fill:var(--bg-shell);stroke:var(--border-default)}
    svg.seq .a-name{fill:var(--text-main);font-weight:700;font-size:13px}
    svg.seq .life{stroke:var(--border-default);stroke-dasharray:4 5}
    svg.seq .hop{cursor:pointer}
    svg.seq .hop .hit{fill:transparent}
    svg.seq .hop:hover .hit,svg.seq .hop.sel .hit{fill:var(--blue-soft)}
    svg.seq .ln{fill:none;stroke-width:2}
    svg.seq .st-done .ln{stroke:var(--emerald)} svg.seq .st-done .num{fill:var(--emerald)}
    svg.seq .st-active .ln{stroke:var(--blue-bright)} svg.seq .st-active .num{fill:var(--blue)}
    svg.seq .st-todo .ln{stroke:var(--text-muted);stroke-dasharray:6 4} svg.seq .st-todo .num{fill:var(--text-muted)}
    svg.seq .num-t{fill:#fff;font-weight:700;font-size:11px;text-anchor:middle}
    svg.seq .lbl{text-anchor:middle} svg.seq .hop.sel .lbl{fill:var(--text-main);font-weight:700}
    .hop-panel{margin:10px 16px 16px;padding:12px 14px;border:1px solid var(--border-subtle);border-left:3px solid var(--border-active);border-radius:8px;background:var(--bg-shell);font-size:13px;line-height:1.7;color:var(--text-sub)}
    .hop-panel b{color:var(--text-main)} .hop-panel code{font-size:12px;color:var(--blue-bright)}
    .hop-nav{display:flex;gap:8px;margin-top:8px}
    .hop-ph{padding:14px 16px;font-size:12px;color:var(--text-muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 顶栏 -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="badge">FEISHU BOT · PROJECT PLAN</span>
        <h1 id="pageTitle">飞书机器人 · 项目计划</h1>
      </div>
      <div class="topbar-right">
        <div class="progress-pill">
          <span class="progress-pill-label">推进进度</span>
          <div class="mini-bar"><div class="mini-bar-fill" id="progressFill"></div></div>
          <span class="progress-pill-value" id="progressText"></span>
        </div>
        <button class="btn" id="exportBtn" title="把全部批注与疑问导出为 Markdown 文件">导出批注</button>
        <button class="btn" id="themeBtn">切换浅色</button>
      </div>
    </header>

    <!-- 固定原则 -->
    <div class="principle">
      <span class="principle-icon">🛡️</span>
      <div><span class="principle-label">固定原则（防阻塞红线）：</span><span id="principleText"></span></div>
    </div>

    <!-- 筛选 + 内容 + 架构侧栏 -->
    <div class="main-row">
      <div class="content-col">
        <div class="filters" id="filters"></div>
        <div class="grid" id="grid"></div>
        <div class="detail" id="detail"></div>
      </div>
    </div>
  </div>

  <script>
    /**
     * ============================================================
     * 数据配置区（日常更新只改这个 PLAN_DATA 对象）
     * status 取值: "done" | "active" | "todo"
     *   done   = 已完成
     *   active = 进行中
     *   todo   = 未开始
     * 每个 step 的三段内容：
     *   done      = 该步骤已完成的事项（简略）
     *   current   = 该步骤正在做什么（无则为空数组）
     *   remaining = 该步骤后面还需要做什么
     * ============================================================
     */
    const PLAN_DATA = {
      projectTag: "FEISHU BOT · PROJECT PLAN",
      title: "飞书机器人 · 项目计划",
      updated: "2026-10-28",
      principle: "计划即备忘：已知待办必须上板，不依赖对话上下文。证据优先，需求范围、调用许可、远端部署事实与游戏内效果分层记录，任何一层都不能替代另一层。",
      steps: [
        {
          id: "01",
          status: "done",
          title: "需求范围与证据规则",
          desc: "全部原始业务条目保留在需求范围内",
          done: [
            "确认原始 Excel 的全部条目都属于需求范围，不因单条资料暂缺而缩小",
            "确立三层分离记录：业务资料 / 仓库实现 / 真实环境结果",
            "确立状态用词与「单条缺证只阻塞该条」原则"
          ],
          current: [],
          remaining: [
            "逐条台账按本规则继续补齐（见 STEP 06）"
          ]
        },
        {
          id: "02",
          status: "done",
          title: "机器人侧调用权威收敛",
          desc: "catalog 是唯一的 path + args 调用合同",
          done: [
            "catalog 定为唯一机器人侧精确执行合同",
            "知识文档、脚本名、近义词、历史资料均不扩展调用能力",
            "写操作仍须原请求人确认；知识问答不授予执行权限"
          ],
          current: [],
          remaining: [
            "catalog 登记不等于 GS-1 已部署，仍需 STEP 07 环境核验"
          ]
        },
        {

          {from:"gen",to:"gen",s:"active",t:"推导 patch 类型",d:"<b>当前改造点：</b>由 is_client / is_server 决定类型：客户端值 → <code>client_avatar</code>，服务端值 → <code>common</code>。此前默认打 common，导致客户端不生效。方案已由实测定案，待实施。"},
          {from:"gen",to:"fs",s:"todo",t:"双端值写两份",d:"双端阈值生成<b>内容相同</b>的两份 patch，同 key 分落两个目录，只改文件名前缀；并向示范样本对齐 Lua 写法（含 guard）。"},
          {from:"fs",to:"srv",s:"todo",t:"common/auto_common_*",d:"服务端只加载 common 类型。落位路径：<code>patch/common/auto_common_patch_&lt;字段&gt;_&lt;服号&gt;.lua</code>"},
          {from:"fs",to:"cli",s:"todo",t:"client_avatar/auto_client_*",d:"客户端只加载 client_avatar 类型。已有的 common 阈值 Patch 需补发 client_avatar 副本。"}
        ]
      },
      "05": {
        title: "机器人执行链路 · 请求到目标服的时序",
        actors: [
          {id:"u",name:"飞书用户",sub:"@机器人"},
          {id:"g",name:"Gateway",sub:"AI 计划 / SQLite"},
          {id:"w",name:"Worker",sub:"内网"},
          {id:"m",name:"Muliu Task 89",sub:"只收 path+args"},
          {id:"d",name:"GS-1 dispatcher",sub:"/home/serverGeneralScript"},
          {id:"t",name:"目标测试服",sub:"脚本执行"}
        ],
        msgs: [
          {from:"u",to:"g",s:"done",t:"自然语言请求",d:"在飞书群 @机器人 提出需求。"},
          {from:"g",to:"g",s:"done",t:"精确合同校验",d:"AI 计划 → 对照 catalog 精确 path+args 合同；推导 <code>route_region</code>。执行许可只由合同决定。"},
          {from:"g",to:"u",s:"done",t:"确认卡",d:"写操作须原请求人确认；知识问答不授予执行权限。"},
          {from:"g",to:"w",s:"done",t:"入队任务",d:"状态落 SQLite，Worker 领取。"},
          {from:"w",to:"w",s:"done",t:"重校验 · region 二次推导",d:"Worker 独立重算 route_region，与 Gateway 严格比对，不一致即拒绝。"},
          {from:"w",to:"m",s:"done",t:"path + args",d:"只传精确路径与参数。"},
          {from:"m",to:"d",s:"todo",t:"分发",d:"<b>待 STEP 07：</b>catalog 登记 ≠ GS-1 已部署，需有权限者核验。"},
          {from:"d",to:"t",s:"todo",t:"执行脚本",d:"<b>待 STEP 07：</b>核验 Task 89 与目标脚本。"},
          {from:"t",to:"g",s:"todo",t:"可信终态回传",d:"回传链路与失败卡片均已实现（STEP 09）；但 GS-1 / 目标服尚未部署核验，端到端待 STEP 07 确认。"}
        ]
      }
    };
    FLOWS["07"] = FLOWS["05"];
    const flowSel = {};

    function flowInner(id) {
      const f = FLOWS[id], sel = flowSel[id];
      const colW = 170, top = 70, rowH = 64, W = f.actors.length * colW, H = top + f.msgs.length * rowH + 16;
      const ix = {}; f.actors.forEach((a, i) => ix[a.id] = i);
      const cx = i => colW * i + colW / 2;
      let s = `<svg class="seq" viewBox="0 0 ${W} ${H}" style="min-width:${Math.min(W, 820)}px">
        <defs>${[["done","--emerald"],["active","--blue-bright"],["todo","--text-muted"]].map(([k,v]) =>
          `<marker id="ah-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(${v})"/></marker>`).join("")}</defs>`;
      f.actors.forEach((a, i) => {
        s += `<line class="life" x1="${cx(i)}" y1="52" x2="${cx(i)}" y2="${H}"/>
          <rect class="a-box" x="${cx(i)-70}" y="4" width="140" height="48" rx="8"/>
          <text class="a-name" x="${cx(i)}" y="25" text-anchor="middle">${escapeHtml(a.name)}</text>
          <text x="${cx(i)}" y="42" text-anchor="middle" style="font-size:10px">${escapeHtml(a.sub||"")}</text>`;
      });
      f.msgs.forEach((m, i) => {
        const y = top + i * rowH + 30, a = cx(ix[m.from]), b = cx(ix[m.to]);
        let line, lx, ly, nx;
        if (a === b) {
          line = `<path class="ln" d="M${a} ${y-10} h46 v24 h-44" marker-end="url(#ah-${m.s})"/>`;
          lx = a + 56; ly = y + 8; nx = a - 14;
        } else {
          line = `<line class="ln" x1="${a}" y1="${y}" x2="${b}" y2="${y}" marker-end="url(#ah-${m.s})"/>`;
          lx = (a + b) / 2; ly = y - 9; nx = a + (b > a ? 16 : -16);
        }
        const anchor = a === b ? ' style="text-anchor:start"' : "";
        s += `<g class="hop st-${m.s}${sel===i?" sel":""}" onclick="selectHop('${id}',${i})">
          <rect class="hit" x="${Math.min(a,b)-24}" y="${y-26}" width="${Math.abs(b-a)+(a===b?190:48)}" height="${rowH-6}" rx="8"/>
          ${line}<circle class="num" cx="${nx}" cy="${y}" r="10"/><text class="num-t" x="${nx}" y="${y+4}">${i+1}</text>
          <text class="lbl" x="${lx}" y="${ly}"${anchor}>${escapeHtml(m.t)}</text></g>`;
      });
      s += "</svg>";
      const SL = {done:"已完成", active:"进行中", todo:"待实现"};
      let panel = `<div class="hop-ph">点击任一箭头查看这一步的说明（← → 也可切换）</div>`;
      if (sel != null) {
        const m = f.msgs[sel], A = k => f.actors[ix[k]].name;
        panel = `<div class="hop-panel"><b>第 ${sel+1} 步 · ${escapeHtml(A(m.from))} ${m.from===m.to?"自处理":"→ "+escapeHtml(A(m.to))}</b>
          <span class="status-tag status-${m.s}" style="margin-left:8px">${SL[m.s]}</span><div>${m.d}</div>
          <div class="hop-nav"><button class="btn" onclick="selectHop('${id}',${sel-1})" ${sel===0?"disabled":""}>← 上一步</button>
          <button class="btn" onclick="selectHop('${id}',${sel+1})" ${sel===f.msgs.length-1?"disabled":""}>下一步 →</button></div></div>`;
      }
      return `<div class="flow-head"><span>🔀</span>${escapeHtml(f.title)}
        <span class="flow-legend"><span><i style="color:var(--emerald)"></i>已完成</span><span><i style="color:var(--blue-bright)"></i>进行中</span><span><i style="color:var(--text-muted);border-top-style:dashed"></i>待实现</span></span></div>
        <div class="flow-scroll">${s}</div>${panel}`;
    }
    function renderFlow(id) { return FLOWS[id] ? `<div class="flow-block" id="flowWrap">${flowInner(id)}</div>` : ""; }
    function selectHop(id, i) {
      const n = FLOWS[id].msgs.length;
      if (i < 0 || i >= n) return;
      flowSel[id] = i;
      document.getElementById("flowWrap").innerHTML = flowInner(id);
    }

    function loadNotes() {
      try { return JSON.parse(localStorage.getItem(NOTES_KEY)) || {}; }
      catch (e) { return {}; }
    }
    function saveNotes(notes) {
      try { localStorage.setItem(NOTES_KEY, JSON.stringify(notes)); } catch (e) {}
    }

    /* ==================== 手动改状态（浏览器本地覆盖） ====================
       点击状态标签即可切换已完成 / 进行中 / 未开始。改动存 localStorage，
       只影响本机浏览器视图，不改仓库里的 PLAN_DATA；需要永久生效时导出给维护者。
       ================================================================== */
    const STATUS_OVERRIDE_KEY = "hotfix-plan-status-overrides-v1";

    function loadStatusOverrides() {
      try { return JSON.parse(localStorage.getItem(STATUS_OVERRIDE_KEY)) || {}; }
      catch (e) { return {}; }
    }

    function applyStatusOverrides() {
      const overrides = loadStatusOverrides();
      PLAN_DATA.steps.forEach(step => {
        if (overrides[step.id]) step.status = overrides[step.id];
      });
    }

    function closeStatusMenu() {
      const menu = document.querySelector(".status-menu");
      if (menu) menu.remove();
    }

    function openStatusMenu(event, stepId) {
      event.stopPropagation();
      closeStatusMenu();
      const step = PLAN_DATA.steps.find(s => s.id === stepId);
      if (!step) return;

      const menu = document.createElement("div");
      menu.className = "status-menu";
      menu.innerHTML = ["done", "active", "todo"].map(key => `
        <button class="${step.status === key ? "current" : ""}" onclick="setStatus('${stepId}','${key}')">
          ${step.status === key ? "● " : ""}${STATUS_LABEL[key]}
        </button>`).join("") +
        `<div class="hint">改动只在本机浏览器生效<br>永久生效请导出后告知维护者</div>`;

      document.body.appendChild(menu);
      const rect = event.currentTarget.getBoundingClientRect();
      menu.style.left = Math.min(rect.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - 150) + "px";
      menu.style.top = (rect.bottom + window.scrollY + 6) + "px";
    }

    function setStatus(stepId, status) {
      const step = PLAN_DATA.steps.find(s => s.id === stepId);
      if (!step) return;
      step.status = status;
      const overrides = loadStatusOverrides();
      overrides[stepId] = status;
      try { localStorage.setItem(STATUS_OVERRIDE_KEY, JSON.stringify(overrides)); } catch (e) {}
      closeStatusMenu();
      renderFilters();
      renderProgress();
      renderGrid();
      if (currentStepId === stepId) openDetail(stepId);
    }

    /* ==================== 状态映射 ==================== */
    const STATUS_LABEL = { done: "已完成", active: "进行中", todo: "未开始" };
    const STATUS_ORDER = ["done", "active", "todo"];

    let activeFilter = "all";
    let currentStepId = null;

    function noteKey(stepId, field) { return stepId + ":" + field; }
    function hasNote(stepId) {
      const notes = loadNotes();
      const rec = notes[stepId];
      return !!rec && ((rec.note || "").trim() || (rec.question || "").trim());
    }

    function countByStatus(status) {
      return PLAN_DATA.steps.filter(s => s.status === status).length;
    }

    /* ==================== 渲染：网格 ==================== */
    function renderFilters() {
      const total = PLAN_DATA.steps.length;
      const items = [
        { key: "all", label: "全部", count: total },
        { key: "active", label: "进行中", count: countByStatus("active") },
        { key: "done", label: "已完成", count: countByStatus("done") },
        { key: "todo", label: "未开始", count: countByStatus("todo") }
      ];
      document.getElementById("filters").innerHTML = items.map(it => `
        <button class="filter-btn ${activeFilter === it.key ? "active" : ""}"
                onclick="setFilter('${it.key}')">
          ${it.label}<span class="cnt">${it.count}</span>
        </button>
      `).join("");
    }

    function setFilter(key) {
      activeFilter = key;
      renderFilters();
      renderGrid();
    }

    function renderGrid() {
      const steps = PLAN_DATA.steps.filter(s => activeFilter === "all" || s.status === activeFilter);
      document.getElementById("grid").innerHTML = steps.map(s => `
        <div class="card status-${s.status}" onclick="openDetail('${s.id}')">
          <div class="card-head">
            <div class="step-num">${s.id}</div>
            <span class="status-tag status-${s.status}" data-editable onclick="openStatusMenu(event, '${s.id}')" title="点击切换状态">${STATUS_LABEL[s.status]}</span>
          </div>
          <div class="card-title">${s.title}</div>
          <div class="card-desc">${s.desc}</div>
          <div class="card-foot">
            <span>${s.done.length} 项已完成 · ${s.remaining.length} 项待办</span>
            ${hasNote(s.id) ? `<span class="note-flag">有批注</span>` : `<span class="open">查看详情 →</span>`}
          </div>
        </div>
      `).join("");
    }

    function renderProgress() {
      const done = countByStatus("done");
      const total = PLAN_DATA.steps.length;
      const pct = Math.round((done / total) * 100);
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("progressText").textContent = `${done}/${total} (${pct}%)`;
    }

    /* ==================== 渲染：详情 ==================== */
    function listHtml(items, mk) {
      if (!items || !items.length) return `<div class="block-empty">暂无</div>`;
      return `<ul>${items.map(t => `<li><span class="mk">${mk}</span><span>${t}</span></li>`).join("")}</ul>`;
    }

    function openDetail(id) {
      currentStepId = id;
      const s = PLAN_DATA.steps.find(x => x.id === id);
      const notes = loadNotes();
      const rec = notes[id] || { note: "", question: "" };
      const isLast = PLAN_DATA.steps.findIndex(x => x.id === id) === PLAN_DATA.steps.length - 1;

      document.getElementById("detail").innerHTML = `
        <div class="detail-head">
          <div class="detail-topline">
            <button class="btn" onclick="closeDetail()">← 返回全部卡片</button>
            <span class="status-tag status-${s.status}" data-editable style="font-size:12px;padding:5px 13px;" onclick="openStatusMenu(event, '${s.id}')" title="点击切换状态">${STATUS_LABEL[s.status]}</span>
          </div>
          <div class="detail-title">STEP ${s.id} · ${s.title}</div>
          <div class="detail-desc">${s.desc}</div>
        </div>

        <div class="detail-body">
          ${renderFlow(id)}
          <div class="block block-done">
            <div class="block-head"><span class="ico">✓</span>已完成<span class="n">${s.done.length} 项</span></div>
            ${listHtml(s.done, "✓")}
          </div>

          <div class="block block-cur">
            <div class="block-head"><span class="ico">●</span>正在做什么<span class="n">${s.current.length} 项</span></div>
            ${listHtml(s.current, "●")}
          </div>

          <div class="block block-todo">
            <div class="block-head"><span class="ico">○</span>后面还需做什么<span class="n">${s.remaining.length} 项</span></div>
            ${listHtml(s.remaining, "○")}
          </div>

          <div class="notes-block">
            <div class="notes-head">
              <span>📝</span> 我的批注与疑问
              <span class="hint">自动保存到本机浏览器 · 不会写入 Git</span>
            </div>
            <div class="note-field">
              <div class="note-label"><span>💬</span> 批注 / 想法</div>
              <textarea id="noteInput" placeholder="记录你对这个步骤的批注、想法、待办补充……"
                        oninput="onNoteInput()">${escapeHtml(rec.note || "")}</textarea>
            </div>
            <div class="note-field">
              <div class="note-label"><span>❓</span> 疑问 / 待澄清</div>
              <textarea id="questionInput" placeholder="记录你不理解、需要确认、或者有分歧的地方……"
                        oninput="onNoteInput()">${escapeHtml(rec.question || "")}</textarea>
            </div>
            <div class="note-field" style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
              <span class="save-status" id="saveStatus">改动会自动保存</span>
              <div style="display:flex;gap:8px;">
                <button class="btn" onclick="clearNote('${id}')">清空本条批注</button>
                <button class="btn btn-primary" onclick="exportNotes()">导出全部批注</button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("grid").classList.add("hide");
      document.getElementById("detail").classList.add("show");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function closeDetail() {
      currentStepId = null;
      document.getElementById("detail").classList.remove("show");
      document.getElementById("grid").classList.remove("hide");
      renderGrid();
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    let saveTimer = null;
    function onNoteInput() {
      if (!currentStepId) return;
      const note = document.getElementById("noteInput").value;
      const question = document.getElementById("questionInput").value;
      const notes = loadNotes();
      notes[currentStepId] = { note, question };
      saveNotes(notes);

      const el = document.getElementById("saveStatus");
      el.textContent = "已保存到本机浏览器";
      el.classList.add("saved");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        el.textContent = "改动会自动保存";
        el.classList.remove("saved");
      }, 1800);
    }

    function clearNote(id) {
      if (!confirm("清空这条步骤的批注与疑问？此操作不可撤销。")) return;
      const notes = loadNotes();
      delete notes[id];
      saveNotes(notes);
      openDetail(id);
    }

    /* ==================== 导出 ==================== */
    function exportNotes() {
      const notes = loadNotes();
      const lines = [
        `# ${PLAN_DATA.title} · 批注与疑问`,
        "",
        `导出时间：${new Date().toLocaleString("zh-CN")}`,
        `原则：${PLAN_DATA.principle}`,
        ""
      ];
      const overrides = loadStatusOverrides();
      const overridden = Object.keys(overrides);
      if (overridden.length) {
        lines.push("## 本机改过的状态（需维护者回写 PLAN_DATA）", "");
        overridden.forEach(id => {
          const step = PLAN_DATA.steps.find(s => s.id === id);
          lines.push(`- STEP ${id} ${step ? step.title : ""} → ${STATUS_LABEL[overrides[id]]}`);
        });
        lines.push("");
      }
      let any = false;
      PLAN_DATA.steps.forEach(s => {
        const rec = notes[s.id] || {};
        const note = (rec.note || "").trim();
        const question = (rec.question || "").trim();
        if (!note && !question) return;
        any = true;
        lines.push(`## STEP ${s.id} · ${s.title}`);
        lines.push(`状态：${STATUS_LABEL[s.status]}`);
        lines.push("");
        if (note) { lines.push("**批注 / 想法**", "", note, ""); }
        if (question) { lines.push("**疑问 / 待澄清**", "", question, ""); }
        lines.push("---", "");
      });
      if (!any) {
        alert("还没有任何批注或疑问，无需导出。");
        return;
      }
      const blob = new Blob([lines.join("\n")], { type: "text/markdown;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `hotfix-plan-notes-${PLAN_DATA.updated}.md`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    /* ==================== 主题 ==================== */
    function toggleTheme() {
      const root = document.documentElement;
      const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
      root.setAttribute("data-theme", next);
      document.getElementById("themeBtn").textContent = next === "dark" ? "切换浅色" : "切换深色";
    }

    /* ==================== 初始化 ==================== */
    document.getElementById("principleText").textContent = PLAN_DATA.principle;
    document.getElementById("pageTitle").textContent = PLAN_DATA.title;
    document.getElementById("themeBtn").addEventListener("click", toggleTheme);
    document.getElementById("exportBtn").addEventListener("click", exportNotes);
    document.addEventListener("click", closeStatusMenu);
    applyStatusOverrides();
    renderProgress();
    renderFilters();
    renderGrid();
  </script>
</body>
</html>
