<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>上传资料 · 组内项目知识库</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #34495e; max-width: 860px; margin: 30px auto; padding: 0 20px; font-size: 14px; }
    h1 { font-size: 22px; } a { color: #42b983; }
    label { display: block; margin: 14px 0 4px; font-weight: 600; }
    input[type=text], select { width: 260px; padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    .hint { color: #7f8c8d; font-size: 12px; font-weight: normal; }
    button { margin-top: 18px; padding: 8px 22px; background: #42b983; color: #fff; border: 0; border-radius: 4px; font-size: 14px; cursor: pointer; }
    button:disabled { background: #9ccfb6; cursor: wait; }
    table { border-collapse: collapse; width: 100%; margin-top: 18px; font-size: 13px; }
    th, td { border: 1px solid #e1e4e8; padding: 6px 8px; text-align: left; vertical-align: top; }
    .added, .updated { color: #2e8b57; } .unchanged { color: #7f8c8d; } .rejected { color: #c0392b; } .held { color: #d68910; }
    .rules { background: #f6f8fa; padding: 10px 14px; border-radius: 4px; font-size: 13px; line-height: 1.7; }
  </style>
</head>
<body>
  <p><a href="./">← 返回知识库</a></p>
  <h1>上传 / 更新资料</h1>
  <div class="rules">
    只接受 <b>.md</b>（Obsidian 整理的文档即可），一次最多 20 个、每个 3 MB 以内。<br>
    同一组别、同一测试、同名文件 = 更新旧版本（历史版本保留，可回滚）；不同测试写同一功能会并存。<br>
    命中 IP、密码、token、手机号、数据库地址等规则的文件不会直接入库，会交给管理员审核，通过后自动入库。<br>
    用例表格会自动统一表头；Excel 合并单元格会向下填充，空分级记为「未分级」。
  </div>
  <form id="f">
    <label>上传人 <span class="hint">（必填，会记录在版本历史里）</span></label>
    <input type="text" id="uploader" maxlength="20" required>
    <label>组别</label>
    <select id="group"><option>系统组</option><option>赛季组</option><option>国服</option><option>其他</option></select>
    <label>测试（作者） <span class="hint">（默认同上传人；替别人上传时填原作者）</span></label>
    <input type="text" id="owner" maxlength="20">
    <label>文件</label>
    <input type="file" id="files" accept=".md" multiple required>
    <br><button type="submit" id="go">上传</button>
  </form>
  <div id="out"></div>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    $('uploader').value = localStorage.getItem('kb-uploader') || '';
    function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]; }); }
    function read(file) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () {
          var bytes = new Uint8Array(r.result), bin = '';
          for (var i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 32768));
          resolve({name: file.name, content: btoa(bin)});
        };
        r.onerror = reject;
        r.readAsArrayBuffer(file);   // raw bytes: the server detects UTF-8 / GBK
      });
    }
    var LABEL = {added: '新增', updated: '已更新', unchanged: '无变化', rejected: '已拒绝', held: '待审核'};
    $('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var uploader = $('uploader').value.trim();
      localStorage.setItem('kb-uploader', uploader);
      $('go').disabled = true; $('go').textContent = '处理中…'; $('out').innerHTML = '';
      Promise.all(Array.prototype.map.call($('files').files, read)).then(function (files) {
        return fetch('api/upload', {method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({uploader: uploader, group: $('group').value, owner: $('owner').value.trim(), files: files})});
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d.ok) { $('out').innerHTML = '<p class="rejected">' + d.errors.map(esc).join('<br>') + '</p>'; return; }
        var html = '<table><tr><th>文件</th><th>结果</th><th>用例数</th><th>说明</th></tr>';
        d.files.forEach(function (f) {
          var link = f.path && (f.status === 'added' || f.status === 'updated' || f.status === 'unchanged') ? '<br><a href="./#/' + encodeURI(f.path.replace(/\.md$/, '')) + '">查看</a>' : '';
          html += '<tr><td>' + esc(f.name) + link + '</td><td class="' + f.status + '">' + LABEL[f.status] + '</td><td>'
            + (f.cases != null ? f.cases + (f.unrated ? '（未分级 ' + f.unrated + '）' : '') : '') + '</td><td>'
            + (f.reasons || []).concat(f.warnings || []).map(esc).join('<br>') + '</td></tr>';
        });
        $('out').innerHTML = html + '</table>';
      }).catch(function () {
        $('out').innerHTML = '<p class="rejected">上传失败：服务暂不可用，请稍后重试或联系管理员。</p>';
      }).then(function () { $('go').disabled = false; $('go').textContent = '上传'; });
    });
  </script>
</body>
</html>
