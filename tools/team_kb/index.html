  <link rel="stylesheet" href="_assets/vue.css">
  <style>
    .markdown-section { max-width: 1400px; }
    .markdown-section table { display: table; width: 100%; font-size: 13px; }

  </script>
  <!-- docsify 4.13.1 (MIT), vendored under _assets: works without internet access from the browser -->
