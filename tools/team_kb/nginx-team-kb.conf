# /etc/nginx/sites-available/team-kb — 组内项目知识库（内网访问，无登录：2026-11-10 用户确认）
server {
    listen 8090;
    server_name _;
    root /opt/team-kb/site;
    index index.html;
    charset utf-8;
    charset_types text/markdown text/css application/javascript;
    types { text/html html; text/css css; application/javascript js; text/markdown md; }

    location ~ /\. { deny all; }
    location /api/ {
        proxy_pass http://127.0.0.1:8091;
        client_max_body_size 50m;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
